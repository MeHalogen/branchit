name: Bug report
description: Something did the wrong thing, or the wrong Git command
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally starting from `branchit demo` or a fresh repository.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `branchit doctor`
      render: text
    validations:
      required: true
