# Branchy dogfoods its own config. See .branchy.example.toml for all options.

[branches]
protected = ["main"]

[commit]
scopes = ["cli", "git", "app", "screens", "workflows", "config", "docs"]
max_subject_length = 72

[checks]
# Branchy runs its own typecheck + tests before a commit (once trusted).
commands = ["npm run typecheck", "npm test"]
