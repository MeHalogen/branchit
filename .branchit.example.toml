# Branchit repository configuration (.branchit.toml)
#
# Copy to `.branchit.toml` and edit. Every field is optional; unspecified values
# fall back to your user config (~/.config/branchit/config.toml) and then to
# Branchit's built-in defaults. Run `branchit config` to see the resolved result.

[ui]
# Show the underlying git command before meaningful actions.
command_preview = true
# Use Unicode glyphs (false = ASCII fallback).
icons = true
# Palette: "default", "catppuccin", "tokyo-night", "gruvbox", or "none" (no color).
theme = "default"

[branches]
# Override base-branch detection for the sweeper and PR readiness.
# default_base = "main"
# Branches that must never be casually deleted. Supports exact names and
# `prefix/*` globs.
protected = ["main", "master", "develop", "release/*"]

[commit]
# Conventional commit types. Strings, or { name, description } tables.
types = [
  { name = "feat", description = "New user-facing capability" },
  { name = "fix", description = "Bug fix" },
  { name = "docs", description = "Documentation only" },
  { name = "refactor", description = "Neither a feature nor a bug fix" },
  { name = "test", description = "Adding or fixing tests" },
  { name = "chore", description = "Maintenance / other" },
]
# Suggested scopes offered during the commit flow.
scopes = ["cli", "git", "ui", "config"]
max_subject_length = 72
require_scope = false

[checks]
# Pre-commit checks. These run local programs, so Branchit requires you to
# explicitly TRUST this repository for exactly this command set before running
# them (and re-prompts if the set changes). Leave unset to auto-detect known
# package.json scripts instead.
# commands = ["npm run typecheck", "npm test"]

[worktrees]
# Where `t` → add puts new worktrees. Relative to the repository root unless
# absolute; {repo} and {branch} are substituted ("feat/x" becomes "feat-x").
# root = "../{repo}-wt/{branch}"

[keys]
# Rebind dashboard keys by command name. ":", "?" and "q" are reserved.
# Names: switchBranch newBranch commit sweep fetch prepare workingTree sync
#        stash worktrees undo recover search refresh help quit
# sweep = "x"

[ai]
# Optional: a program that reads the staged diff on stdin and prints a commit
# message (first line = subject). Runs without a shell, only after you trust
# it, and never ships a provider or touches API keys. ctrl+g in the commit flow.
# command = "llm -m claude-sonnet-5-5 -s 'Write a conventional commit message for this diff.'"
